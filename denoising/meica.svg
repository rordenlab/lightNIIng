<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Multi-echo component classification</title>
  <desc id="desc">Across three echoes, a BOLD component's percent signal change grows in proportion to echo time, while a non-BOLD component's is constant.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--fg-base, #f0f1ed); }
    .title { font-size: 34px; font-weight: 650; letter-spacing: -.8px; }
    .subtitle { font-size: 17px; fill: var(--fg-muted, #a4aaa6); }
    .panel-title { font-size: 22px; font-weight: 650; }
    .panel-index { font: 650 14px ui-monospace, SFMono-Regular, monospace; fill: var(--accent, #bf5700); }
    .panel-note, .axis-label { font-size: 14px; fill: var(--fg-muted, #a4aaa6); }
    .tick { font: 600 13px ui-monospace, SFMono-Regular, monospace; fill: var(--fg-muted, #a4aaa6); }
    .formula { font: 650 14px ui-monospace, SFMono-Regular, monospace; fill: var(--fg-base, #f0f1ed); }
    .panel-rule, .grid { stroke: color-mix(in srgb, var(--fg-muted, #a4aaa6) 28%, transparent); }
    .axis { stroke: var(--fg-muted, #a4aaa6); stroke-width: 1.5; }
    .frame { fill: color-mix(in srgb, var(--accent, #bf5700) 4%, transparent); stroke: color-mix(in srgb, var(--fg-muted, #a4aaa6) 20%, transparent); }
    .bold-fit { stroke: var(--accent, #bf5700); stroke-width: 4; stroke-linecap: round; }
    .bold-dot { fill: var(--accent, #bf5700); stroke: var(--bg-base, #0a0c0c); stroke-width: 3; }
    .nonbold-fit { stroke: var(--fg-muted, #a4aaa6); stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; }
    .nonbold-dot { fill: var(--fg-muted, #a4aaa6); stroke: var(--bg-base, #0a0c0c); stroke-width: 3; }
  </style>
  <text x="76" y="62" class="title">Multi-echo ICA</text>
  <text x="77" y="91" class="subtitle">Echo-time dependence separates BOLD signal from artifact (echoes at 15, 35 and 55 ms)</text>
  <rect x="76" y="123" width="499" height="499" rx="12" class="frame"/>
  <text x="98" y="157" class="panel-index">01</text>
  <text x="131" y="157" class="panel-title">BOLD component</text>
  <text x="131" y="181" class="panel-note">Signal change grows with echo time: high κ, accepted</text>
  <line x1="98" y1="199" x2="553" y2="199" class="panel-rule"/>
  <line x1="168" y1="540" x2="528" y2="540" class="grid"/><text x="156" y="545" text-anchor="end" class="tick">0%</text><line x1="168" y1="405" x2="528" y2="405" class="grid"/><text x="156" y="410" text-anchor="end" class="tick">1%</text><line x1="168" y1="270" x2="528" y2="270" class="grid"/><text x="156" y="275" text-anchor="end" class="tick">2%</text><text x="168" y="566" text-anchor="middle" class="tick">0</text><text x="288" y="566" text-anchor="middle" class="tick">20</text><text x="408" y="566" text-anchor="middle" class="tick">40</text><text x="528" y="566" text-anchor="middle" class="tick">60</text>
  <line x1="168" y1="540" x2="528" y2="540" class="axis"/>
  <line x1="168" y1="540" x2="528" y2="310.66817667044165" class="bold-fit"/>
  <circle cx="259.2" cy="481.9" r="8" class="bold-dot"/><circle cx="379.9" cy="405.0" r="8" class="bold-dot"/><circle cx="500.5" cy="328.2" r="8" class="bold-dot"/>
  <text x="348" y="596" text-anchor="middle" class="axis-label">echo time (ms)</text>
  <text x="176" y="252" class="formula">ΔS/S = −TE · ΔR2*</text>
  <rect x="625" y="123" width="499" height="499" rx="12" class="frame"/>
  <text x="647" y="157" class="panel-index">02</text>
  <text x="680" y="157" class="panel-title">Non-BOLD component</text>
  <text x="680" y="181" class="panel-note">Signal change is flat across echoes: high ρ, rejected</text>
  <line x1="647" y1="199" x2="1102" y2="199" class="panel-rule"/>
  <line x1="717" y1="540" x2="1077" y2="540" class="grid"/><text x="705" y="545" text-anchor="end" class="tick">0%</text><line x1="717" y1="405" x2="1077" y2="405" class="grid"/><text x="705" y="410" text-anchor="end" class="tick">1%</text><line x1="717" y1="270" x2="1077" y2="270" class="grid"/><text x="705" y="275" text-anchor="end" class="tick">2%</text><text x="717" y="566" text-anchor="middle" class="tick">0</text><text x="837" y="566" text-anchor="middle" class="tick">20</text><text x="957" y="566" text-anchor="middle" class="tick">40</text><text x="1077" y="566" text-anchor="middle" class="tick">60</text>
  <line x1="717" y1="540" x2="1077" y2="540" class="axis"/>
  <line x1="717" y1="405" x2="1077" y2="405" class="nonbold-fit"/>
  <circle cx="808.2" cy="405.0" r="8" class="nonbold-dot"/><circle cx="928.9" cy="405.0" r="8" class="nonbold-dot"/><circle cx="1049.5" cy="405.0" r="8" class="nonbold-dot"/>
  <text x="897" y="596" text-anchor="middle" class="axis-label">echo time (ms)</text>
  <text x="725" y="252" class="formula">ΔS/S = ΔS0 / S0</text>
</svg>
