<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--fg-base, #f0f1ed)}.title{font-size:34px;font-weight:650;letter-spacing:-.8px}.subtitle{fill:var(--fg-muted, #9a9f9b);font-size:17px}.label{font-size:17px;font-weight:600}.value{font:600 14px ui-monospace,SFMono-Regular,monospace}.accent{fill:var(--accent, #bf5700)}</style>
